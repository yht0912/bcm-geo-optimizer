name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate public package
        run: python3 scripts/validate_package.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build synthetic scorecard
        run: python3 scripts/geo_outcome_scorecard.py --input examples/evidence-sample.json --output /tmp/geo-scorecard.json
      - name: Compare synthetic baseline and retest
        run: python3 scripts/geo_delta_compare.py --baseline examples/evidence-baseline.json --retest examples/evidence-retest.json --output /tmp/geo-delta.json
      - name: Build synthetic action queue
        run: python3 scripts/geo_action_prioritizer.py --input examples/actions-sample.json --output /tmp/geo-action-queue.json
      - name: Import synthetic CSV evidence
        run: python3 scripts/geo_csv_import.py --input examples/evidence-sample.csv --study-id example-study --purpose "Synthetic import check" --output /tmp/geo-evidence-imported.json
      - name: Build privacy review export
        env:
          GEO_ANONYMIZATION_SALT: synthetic-ci-salt-not-for-production
        run: python3 scripts/geo_privacy_export.py --input /tmp/geo-evidence-imported.json --time-granularity day --output /tmp/geo-evidence-public.json
